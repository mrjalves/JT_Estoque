# /etc/nginx/sites-available/jt_sistemas_estoque
#
# Como ativar e obter o certificado SSL (HTTPS):
# 1. sudo ln -s /etc/nginx/sites-available/jt_sistemas_estoque /etc/nginx/sites-enabled/
# 2. sudo nginx -t
# 3. sudo systemctl reload nginx
# 4. Obter Certificado SSL (Let's Encrypt - resolve o aviso "Não seguro" / "Inseguro"):
#    sudo certbot --nginx -d estoque.jtecsistemas.com.br
#
# Blazor Server (InteractiveServer) usa WebSocket/SignalR: precisa de Upgrade real
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

server {
    listen 80;

    server_name estoque.jtecsistemas.com.br;

    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:5004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conexoes longas do circuito Blazor
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

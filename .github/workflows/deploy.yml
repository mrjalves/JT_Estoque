name: Deploy Estoque

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-estoque
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: src/JT_Estoque.Web/JT_Estoque.Web.csproj
  SERVICE: jt_sistemas_estoque
  DEST: /var/www/jt_sistemas_estoque
  DOTNET: 10.0.x

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout JT_Estoque
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout JT_ApplicationLayer
        uses: actions/checkout@v4
        with:
          repository: mrjalves/JT_ApplicationLayer
          token: ${{ secrets.GH_PAT }}
          path: JT_ApplicationLayer
          ref: Master
          persist-credentials: false

      - name: Prepare JT_ApplicationLayer sibling path
        run: |
          rm -rf "$GITHUB_WORKSPACE/../JT_ApplicationLayer"
          mv "$GITHUB_WORKSPACE/JT_ApplicationLayer" "$GITHUB_WORKSPACE/../JT_ApplicationLayer"
          for f in "$GITHUB_WORKSPACE/../JT_ApplicationLayer/JT_UserInterface.Shared/Components"/*/*.razor; do
            [ -f "$f" ] || continue
            dir=$(basename "$(dirname "$f")")
            if ! grep -q "@namespace" "$f"; then
              sed -i "1s/^/@namespace JT_UserInterface.Shared.Components.$dir\n/" "$f"
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release -o ./publish -p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          RAW_HOST: ${{ secrets.VPS_HOST }}
          RAW_PORT: ${{ secrets.VPS_PORT }}
          RAW_USER: ${{ secrets.VPS_USER }}
          RAW_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -e
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          VPS_HOST=$(clean "$RAW_HOST")
          VPS_PORT=$(clean "$RAW_PORT")
          VPS_USER=$(clean "$RAW_USER")
          VPS_PATH=$(clean "$RAW_PATH")
          [ -n "$VPS_PATH" ] || VPS_PATH="$DEST"

          for v in VPS_HOST VPS_PORT VPS_USER; do
            [ -n "${!v}" ] || { echo "::error::Secret $v vazio"; exit 1; }
          done

          {
            echo "VPS_HOST=$VPS_HOST"
            echo "VPS_PORT=$VPS_PORT"
            echo "VPS_USER=$VPS_USER"
            echo "VPS_PATH=$VPS_PATH"
          } >> "$GITHUB_ENV"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Enviar arquivos para a VPS
        run: |
          rsync -az --delete \
            --exclude '/appsettings.json' \
            --exclude '/appsettings.Production.json' \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude 'uploads/' \
            --exclude 'logs/' \
            --exclude 'keys/' \
            -e "ssh -p $VPS_PORT -o BatchMode=yes -o ServerAliveInterval=30" \
            ./publish/ \
            "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Reiniciar e verificar serviço
        run: |
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' -- "$VPS_PATH" "${{ env.SERVICE }}" <<'EOF'
          set -e
          VPS_PATH="$1"
          SERVICE_NAME="$2"
          APPSETTINGS_PATH="$VPS_PATH/appsettings.Production.json"

          if [ ! -f "$APPSETTINGS_PATH" ]; then
            echo "::error::Arquivo de configuração não encontrado: $APPSETTINGS_PATH"
            exit 1
          fi

          if command -v python3 >/dev/null 2>&1; then
            JSON_VALIDATOR="python3 -m json.tool"
          elif command -v python >/dev/null 2>&1; then
            JSON_VALIDATOR="python -m json.tool"
          else
            echo "::error::Não foi encontrado python/python3 para validar JSON em $APPSETTINGS_PATH"
            exit 1
          fi

          if ! sh -c "$JSON_VALIDATOR \"$APPSETTINGS_PATH\"" >/dev/null 2>&1; then
            echo "::error::JSON inválido em $APPSETTINGS_PATH. Corrija o arquivo antes do restart."
            echo "Últimas linhas do arquivo para diagnóstico:"
            nl -ba "$APPSETTINGS_PATH" | tail -n 80 || true
            exit 1
          fi

          sudo systemctl restart "$SERVICE_NAME"
          sleep 15
          if ! systemctl is-active --quiet "$SERVICE_NAME"; then
            echo "::error::Serviço $SERVICE_NAME não subiu"
            journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true
            exit 1
          fi
          echo "Serviço ativo. Logs de inicialização/migração:"
          journalctl -u "$SERVICE_NAME" -n 30 --no-pager | grep -A5 MIGRACAO || true
          EOF